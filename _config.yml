# GitHub Pages runs Jekyll only to apply this exclude list; pages are pre-built by build.js.
# Keep the public site to the built output: no markdown sources, build tooling or dictionaries.
exclude:
  - sources
  - build.js
  - bump-sw.js
  - check-quiz-data.js
  - generate-quiz.js
  - locales
  - tools
  - check-languages.js
  - strings.js
  - languages.js
  - page.template.js
  - sw.template.js
  - package.json
  - package-lock.json
  - de-explanations.json
  - tr-explanations.json
  - tr-questions.json
  - ru-explanations.json
  - ru-questions.json
  - state-explanations.json
  - state-questions.json
  - uk-explanations.json
  - uk-questions.json
  - uk-state-explanations.json
  - uk-state-questions.json
  - fa-explanations.json
  - fa-questions.json
  - fa-state-explanations.json
  - fa-state-questions.json
  - README.md
  - CONTRIBUTING.md
